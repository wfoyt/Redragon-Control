[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "redragon-control"
version = "0.2.7"
description = "Onboard lighting and Adwaita/Omarchy themes for Redragon K686 keyboards"
requires-python = ">=3.11"
license = "MIT"
dependencies = []

[project.scripts]
redragonctl = "redragon.cli:main"
redragon-control = "redragon.cli:main"

[tool.setuptools]
packages = ["redragon"]
